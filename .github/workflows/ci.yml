name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-snapshot:
    name: Public snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject secrets and local artifacts
        shell: pwsh
        run: ./scripts/ci-public-snapshot-check.ps1

  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt pytest

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run repository tests
        run: python -m pytest -q

  node-bridge:
    name: Node Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/plwc-chat-bridge/bridge
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: integrations/plwc-chat-bridge/bridge/package-lock.json

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm test

  browser-extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/plwc-chat-bridge/extension
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: integrations/plwc-chat-bridge/extension/package-lock.json

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run check

  store-packages:
    name: Store Packages
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/plwc-chat-bridge/extension
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: integrations/plwc-chat-bridge/extension/package-lock.json

      - name: Install exact dependencies
        shell: powershell
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify reproducible Store packages
        shell: powershell
        run: npm run test:store:windows

  windows-installer:
    name: Windows Installer
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      - name: Run isolated installer contracts
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $result = Invoke-Pester -Script ./installer/windows/tests/installer-contract.Tests.ps1 -PassThru
          if ($result.FailedCount -ne 0) {
            throw "$($result.FailedCount) Windows installer contract test(s) failed."
          }
